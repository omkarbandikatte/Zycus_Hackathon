<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">StockPulse system architecture</title>
  <desc id="desc">Architecture diagram showing the React console communicating with Spring Boot APIs, application services, domain persistence, asynchronous commerce signals, recommendation strategies, and optional LLM providers.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f8fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17324d" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#41657d"/>
    </marker>
    <marker id="eventArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#d26a3a"/>
    </marker>
    <style>
      .title { font: 700 32px 'Segoe UI', sans-serif; fill: #17324d; letter-spacing: .2px; }
      .subtitle { font: 400 16px 'Segoe UI', sans-serif; fill: #557083; }
      .group { font: 700 14px 'Segoe UI', sans-serif; fill: #527084; letter-spacing: 1.4px; }
      .boxTitle { font: 700 18px 'Segoe UI', sans-serif; fill: #17324d; }
      .boxText { font: 400 14px 'Segoe UI', sans-serif; fill: #4c6678; }
      .small { font: 600 12px 'Segoe UI', sans-serif; fill: #527084; }
      .legend { font: 400 13px 'Segoe UI', sans-serif; fill: #4c6678; }
      .box { fill: url(#panel); stroke: #c8d7df; stroke-width: 2; }
      .accent { fill: #e5f3f1; stroke: #51a69c; stroke-width: 2; }
      .warm { fill: #fff0e8; stroke: #d78255; stroke-width: 2; }
      .blue { fill: #e9f1fb; stroke: #6b96c2; stroke-width: 2; }
      .line { fill: none; stroke: #41657d; stroke-width: 2.5; marker-end: url(#arrow); }
      .event { fill: none; stroke: #d26a3a; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#eventArrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#canvas)"/>
  <circle cx="1500" cy="90" r="180" fill="#dcefeb" opacity=".5"/>
  <circle cx="90" cy="900" r="220" fill="#e6eef8" opacity=".55"/>

  <text x="80" y="72" class="title">StockPulse system architecture</text>
  <text x="80" y="103" class="subtitle">Reactive commerce recommendations with a human approval checkpoint</text>

  <text x="80" y="157" class="group">OPERATIONS CONSOLE</text>
  <rect x="80" y="180" width="290" height="160" rx="12" class="blue" filter="url(#shadow)"/>
  <text x="110" y="222" class="boxTitle">React + Vite console</text>
  <text x="110" y="253" class="boxText">Catalog, inventory, suggestions</text>
  <text x="110" y="278" class="boxText">Accept / reject recommendations</text>
  <text x="110" y="303" class="boxText">Simulated sale and polling</text>
  <text x="110" y="328" class="small">frontend/src/api.js</text>

  <text x="460" y="157" class="group">HTTP AND STREAMING API</text>
  <rect x="460" y="180" width="310" height="160" rx="12" class="box" filter="url(#shadow)"/>
  <text x="490" y="222" class="boxTitle">Spring Boot controllers</text>
  <text x="490" y="253" class="boxText">ProductController</text>
  <text x="490" y="278" class="boxText">SuggestionController</text>
  <text x="490" y="303" class="boxText">StrategyController</text>
  <text x="490" y="328" class="small">REST endpoints + pricing SSE</text>

  <path d="M370 260 H460" class="line"/>
  <text x="383" y="245" class="small">REST / SSE</text>

  <text x="870" y="157" class="group">APPLICATION ORCHESTRATION</text>
  <rect x="870" y="180" width="310" height="160" rx="12" class="accent" filter="url(#shadow)"/>
  <text x="900" y="222" class="boxTitle">Commerce services</text>
  <text x="900" y="253" class="boxText">ProductService</text>
  <text x="900" y="278" class="boxText">CommerceAdvisorService</text>
  <text x="900" y="303" class="boxText">Transactional approval side effects</text>
  <text x="900" y="328" class="small">Shared by HTTP and async callers</text>

  <path d="M770 260 H870" class="line"/>

  <text x="80" y="422" class="group">RECOMMENDATION ENGINE</text>
  <rect x="80" y="445" width="290" height="180" rx="12" class="warm" filter="url(#shadow)"/>
  <text x="110" y="487" class="boxTitle">StrategyRegistry</text>
  <text x="110" y="518" class="boxText">Runtime selection:</text>
  <text x="110" y="545" class="boxText">stockpulse.strategy = rules | ai</text>
  <text x="110" y="578" class="boxText">Separate typed pricing and</text>
  <text x="110" y="602" class="boxText">reorder contracts</text>

  <rect x="460" y="445" width="290" height="180" rx="12" class="box" filter="url(#shadow)"/>
  <text x="490" y="487" class="boxTitle">Deterministic rules</text>
  <text x="490" y="523" class="boxText">RuleBasedPricingStrategy</text>
  <text x="490" y="550" class="boxText">RuleBasedReorderStrategy</text>
  <text x="490" y="586" class="boxText">Validated fallback for every</text>
  <text x="490" y="610" class="boxText">provider failure or bad output</text>

  <rect x="840" y="445" width="340" height="180" rx="12" class="blue" filter="url(#shadow)"/>
  <text x="870" y="487" class="boxTitle">Optional LLM adapter</text>
  <text x="870" y="523" class="boxText">LLMCommerceStrategy</text>
  <text x="870" y="550" class="boxText">LLMGateway</text>
  <text x="870" y="586" class="boxText">Validate price, quantity, confidence</text>
  <text x="870" y="610" class="boxText">Then independently fall back to rules</text>

  <path d="M1025 340 V390 H225 V445" class="line"/>
  <text x="530" y="382" class="small">recommend(context)</text>
  <path d="M225 625 V675 H605 V720" class="line"/>
  <path d="M605 625 V720" class="line"/>
  <path d="M1010 625 V675 H605 V720" class="line"/>

  <text x="80" y="700" class="group">EVENT-DRIVEN SIGNAL PATH</text>
  <rect x="80" y="720" width="290" height="150" rx="12" class="warm" filter="url(#shadow)"/>
  <text x="110" y="760" class="boxTitle">CommerceSignalEvent</text>
  <text x="110" y="791" class="boxText">Stock changes and simulated orders</text>
  <text x="110" y="818" class="boxText">return immediately after publishing</text>
  <text x="110" y="850" class="small">Low-stock / demand-spike triggers</text>

  <rect x="460" y="720" width="290" height="150" rx="12" class="accent" filter="url(#shadow)"/>
  <text x="490" y="760" class="boxTitle">Async recommendation listener</text>
  <text x="490" y="791" class="boxText">AFTER_COMMIT + REQUIRES_NEW</text>
  <text x="490" y="818" class="boxText">Deduplicates pending suggestions</text>
  <text x="490" y="850" class="small">AgenticRecommendationListener</text>

  <path d="M370 795 H460" class="event"/>
  <text x="380" y="778" class="small">after commit</text>
  <path d="M605 720 V625" class="event"/>

  <text x="1260" y="157" class="group">EXTERNAL ADVISORS</text>
  <rect x="1260" y="180" width="260" height="160" rx="12" class="blue" filter="url(#shadow)"/>
  <text x="1290" y="222" class="boxTitle">LLM providers</text>
  <text x="1290" y="255" class="boxText">Gemini</text>
  <text x="1290" y="280" class="boxText">Groq + Llama 3.1</text>
  <text x="1290" y="305" class="boxText">Local Ollama</text>
  <text x="1290" y="328" class="small">Configured by environment</text>
  <path d="M1180 260 H1260" class="line"/>

  <text x="80" y="925" class="group">PERSISTENCE</text>
  <rect x="460" y="900" width="290" height="55" rx="12" class="box"/>
  <text x="490" y="934" class="boxTitle">Spring Data JPA repositories</text>
  <rect x="840" y="900" width="340" height="55" rx="12" class="box"/>
  <text x="870" y="934" class="boxTitle">H2 local database / PostgreSQL deployment</text>
  <path d="M750 795 V875 H605 V900" class="line"/>
  <path d="M1025 340 V875 H1010 V900" class="line"/>
  <text x="1210" y="930" class="legend">Solid arrows: request or data flow</text>
  <text x="1210" y="952" class="legend">Dashed arrows: asynchronous event flow</text>
</svg>
